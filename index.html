<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шахматы · доска с движком</title>
<script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"></script>
<style>
  :root{
    --bg:#0b0d12; --panel:#12151d; --line:#232837;
    --text:#e6e9f2; --muted:#8b93a7;
    --acc:#7c5cff; --ok:#34d399; --bad:#fb7185;
    --light:#e6d7bd; --dark:#a57b57;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 15% -10%,#1b1630 0,transparent 60%),
               radial-gradient(900px 500px at 105% 0,#0e2a33 0,transparent 55%),
               var(--bg);
    color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
    min-height:100vh;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:22px 16px 50px}
  h1{font-size:18px;margin:0 0 14px;letter-spacing:.2px;font-weight:700}
  h1 span{color:var(--muted);font-weight:400;font-size:13px;margin-left:8px}

  .board{
    display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1/1;
    border-radius:14px;overflow:hidden;border:1px solid var(--line);
    box-shadow:0 24px 60px rgba(0,0,0,.55);
    user-select:none;-webkit-tap-highlight-color:transparent;
  }
  .sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .sq.light{background:var(--light)}
  .sq.dark{background:var(--dark)}
  .sq.last{box-shadow:inset 0 0 0 4px rgba(255,235,59,.35)}
  .sq.sel{box-shadow:inset 0 0 0 4px var(--acc)}
  .sq.check{box-shadow:inset 0 0 0 4px var(--bad)}
  .sq .target{
    position:absolute;width:26%;height:26%;border-radius:50%;
    background:rgba(20,20,30,.35);pointer-events:none;
  }
  .sq.target-cap .target{
    width:78%;height:78%;background:transparent;
    border:5px solid rgba(20,20,30,.32);border-radius:50%;
  }
  .piece{
    font-size:min(9.5vw,50px);line-height:1;pointer-events:none;text-align:center;
    position:relative;z-index:2;
  }
  .piece.w{color:#fdfdfd;text-shadow:0 1px 0 #4a3a2a,0 -1px 0 #4a3a2a,1px 0 0 #4a3a2a,-1px 0 0 #4a3a2a,0 3px 5px rgba(0,0,0,.45)}
  .piece.b{color:#20232b;text-shadow:0 1px 0 rgba(255,255,255,.3)}
  .coord{position:absolute;font-size:10px;font-weight:700;font-style:normal;opacity:.65;pointer-events:none}
  .coord.file{right:4px;bottom:1px}
  .coord.rank{left:4px;top:1px}
  .sq.light .coord{color:#6b5236}
  .sq.dark .coord{color:#f6ead9}

  .status{
    margin-top:14px;padding:12px 16px;border-radius:12px;
    background:var(--panel);border:1px solid var(--line);
    font-size:14.5px;min-height:20px;
  }
  .status.check{border-color:rgba(251,113,133,.45);background:rgba(251,113,133,.09)}
  .status.thinking{border-color:rgba(124,92,255,.45);background:rgba(124,92,255,.09)}
  .status.over{border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.09);font-weight:600}

  .controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  button,select{
    font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);padding:9px 14px;transition:.16s;
  }
  button:hover,select:hover{border-color:#3a4256;background:#1a1f2b}
  button.primary{background:linear-gradient(135deg,var(--acc),#5b8cff);border:none;color:#fff;font-weight:600}
  button.primary:hover{filter:brightness(1.09)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .row label{font-size:13px;color:var(--muted)}
  .muted{color:var(--muted);font-size:12.5px;text-align:center;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Шахматы <span>доска + движок</span></h1>

  <div id="board" class="board"></div>
  <div id="status" class="status">Ход белых</div>

  <div class="controls">
    <button class="primary" id="newBtn">Новая партия</button>
    <button id="undoBtn">Отменить ход</button>
    <button id="flipBtn">Перевернуть</button>
  </div>

  <div class="row">
    <label for="sideSel">Играю за:</label>
    <select id="sideSel">
      <option value="w">белых</option>
      <option value="b">чёрных</option>
    </select>
    <label for="diffSel">Сложность:</label>
    <select id="diffSel">
      <option value="1">легко (глубина 1)</option>
      <option value="2" selected>средне (глубина 2)</option>
      <option value="3">сложно (глубина 3)</option>
    </select>
  </div>

  <p class="muted">Клик по фигуре — затем по полю. Пешка автоматически превращается в ферзя.</p>
</div>

<script>
/* ================= утилиты ================= */
const GLYPHS = {
  w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},
  b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}
};
const FILES = 'abcdefgh';

/* ================= состояние ================= */
let game = new Chess();
let playerColor = 'w';
let flipped = false;
let selected = null;
let legalTargets = new Set();
let lastMove = null;
let thinking = false;
let depth = 2;

/* ================= отрисовка ================= */
const boardEl = document.getElementById('board');

function render(){
  let html = '';
  for(let dr = 0; dr < 8; dr++){
    for(let df = 0; df < 8; df++){
      const br = flipped ? 7 - dr : dr;
      const bf = flipped ? 7 - df : df;
      const file = FILES[bf];
      const rank = 8 - br;
      const sq = file + rank;
      const isDark = (br + bf) % 2 === 1;

      let cls = 'sq ' + (isDark ? 'dark' : 'light');
      if(selected === sq) cls += ' sel';
      if(lastMove && (lastMove.from === sq || lastMove.to === sq)) cls += ' last';
      if(legalTargets.has(sq)){
        const target = game.get(sq);
        cls += target ? ' target-cap' : '';
        cls += ' target-sq';
      }
      if(game.in_check() && game.turn() === 'w' && isKing(sq,'w')) cls += ' check';
      if(game.in_check() && game.turn() === 'b' && isKing(sq,'b')) cls += ' check';

      const piece = getPiece(sq);
      let content = '';
      if(legalTargets.has(sq)) content += '<span class="target"></span>';
      if(piece) content += `<span class="piece ${piece.color}">${GLYPHS[piece.color][piece.type]}</span>`;
      if(dr === 7) content += `<i class="coord file">${file}</i>`;
      if(df === 0) content += `<i class="coord rank">${rank}</i>`;

      html += `<div class="${cls}" data-sq="${sq}">${content}</div>`;
    }
  }
  boardEl.innerHTML = html;
}

function getPiece(sq){
  try { return game.get(sq); } catch(e){ return null; }
}
function isKing(sq, color){
  const p = getPiece(sq);
  return p && p.type === 'k' && p.color === color;
}

/* ================= статус ================= */
function updateStatus(){
  const el = document.getElementById('status');
  if(game.in_checkmate()){
    const winner = game.turn() === 'w' ? 'чёрные' : 'белые';
    el.textContent = 'Мат! Победа: ' + winner;
    el.className = 'status over';
  } else if(game.in_stalemate()){
    el.textContent = 'Пат — ничья';
    el.className = 'status over';
  } else if(game.in_threefold_repetition()){
    el.textContent = 'Ничья: троекратное повторение';
    el.className = 'status over';
  } else if(game.insufficient_material()){
    el.textContent = 'Ничья: недостаточно материала';
    el.className = 'status over';
  } else if(game.in_draw()){
    el.textContent = 'Ничья (правило 50 ходов)';
    el.className = 'status over';
  } else if(thinking){
    el.textContent = 'Движок думает…';
    el.className = 'status thinking';
  } else if(game.in_check()){
    el.textContent = (game.turn() === 'w' ? 'Белые' : 'Чёрные') + ' под шахом';
    el.className = 'status check';
  } else {
    el.textContent = game.turn() === 'w' ? 'Ход белых' : 'Ход чёрных';
    el.className = 'status';
  }
}

/* ================= взаимодействие ================= */
boardEl.addEventListener('click', e => {
  const el = e.target.closest('.sq');
  if(el) onSquareClick(el.dataset.sq);
});

function onSquareClick(sq){
  if(thinking || game.game_over()) return;
  if(game.turn() !== playerColor) return;

  if(selected){
    if(legalTargets.has(sq)){
      if(tryMove(selected, sq)){
        selected = null; legalTargets.clear();
        render(); afterPlayerMove();
        return;
      }
    }
    const p = getPiece(sq);
    if(p && p.color === playerColor){
      selected = sq;
      updateTargets();
      render();
      return;
    }
    selected = null; legalTargets.clear();
    render();
    return;
  }

  const p = getPiece(sq);
  if(p && p.color === playerColor){
    selected = sq;
    updateTargets();
    render();
  }
}

function updateTargets(){
  legalTargets.clear();
  if(!selected) return;
  const moves = game.moves({ square: selected, verbose: true });
  for(const m of moves) legalTargets.add(m.to);
}

function tryMove(from, to){
  const moves = game.moves({ verbose: true });
  const matching = moves.filter(m => m.from === from && m.to === to);
  if(!matching.length) return null;
  const needsPromo = matching.some(m => m.promotion);
  const mv = game.move({ from, to, promotion: needsPromo ? 'q' : undefined });
  if(!mv) return null;
  lastMove = { from: mv.from, to: mv.to };
  return mv;
}

function afterPlayerMove(){
  render();
  if(game.game_over()){ updateStatus(); return; }
  if(game.turn() !== playerColor) engineMove();
  else updateStatus();
}

/* ================= движок ================= */
const VAL = { p:100, n:320, b:330, r:500, q:900, k:0 };

// piece-square tables, белая перспектива, сверху (rank 8) вниз (rank 1)
const PST = {
  p:[ 0,0,0,0,0,0,0,0, 50,50,50,50,50,50,50,50, 10,10,20,30,30,20,10,10,
      5,5,10,25,25,10,5,5, 0,0,0,20,20,0,0,0, 5,-5,-10,0,0,-10,-5,5,
      5,10,10,-20,-20,10,10,5, 0,0,0,0,0,0,0,0 ],
  n:[-50,-40,-30,-30,-30,-30,-40,-50, -40,-20,0,0,0,0,-20,-40,
      -30,0,10,15,15,10,0,-30, -30,5,15,20,20,15,5,-30,
      -30,0,15,20,20,15,0,-30, -30,5,10,15,15,10,5,-30,
      -40,-20,0,5,5,0,-20,-40, -50,-40,-30,-30,-30,-30,-40,-50],
  b:[-20,-10,-10,-10,-10,-10,-10,-20, -10,0,0,0,0,0,0,-10,
      -10,0,5,10,10,5,0,-10, -10,5,5,10,10,5,5,-10,
      -10,0,10,10,10,10,0,-10, -10,10,10,10,10,10,10,-10,
      -10,5,0,0,0,0,5,-10, -20,-10,-10,-10,-10,-10,-10,-20],
  r:[ 0,0,0,0,0,0,0,0, 5,10,10,10,10,10,10,5, -5,0,0,0,0,0,0,-5,
      -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5,
      -5,0,0,0,0,0,0,-5, 0,0,0,5,5,0,0,0],
  q:[-20,-10,-10,-5,-5,-10,-10,-20, -10,0,0,0,0,0,0,-10,
      -10,0,5,5,5,5,0,-10, -5,0,5,5,5,5,0,-5, 0,0,5,5,5,5,0,-5,
      -10,5,5,5,5,5,0,-10, -10,0,5,0,0,0,0,-10, -20,-10,-10,-5,-5,-10,-10,-20],
  k:[-30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30,
      -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30,
      -20,-30,-30,-40,-40,-30,-30,-20, -10,-20,-20,-20,-20,-20,-20,-10,
      20,20,0,0,0,0,20,20, 20,30,10,0,0,10,30,20]
};

function evaluate(g){
  const board = g.board(); // [0] = rank 8
  let score = 0;
  for(let r = 0; r < 8; r++){
    for(let f = 0; f < 8; f++){
      const sq = board[r][f];
      if(!sq) continue;
      const val = VAL[sq.type];
      const idx = sq.color === 'w' ? r*8 + f : (7 - r)*8 + f;
      const ps = PST[sq.type][idx];
      score += sq.color === 'w' ? (val + ps) : -(val + ps);
    }
  }
  return score;
}

function search(g, d, alpha, beta){
  if(d === 0) return evaluate(g);
  const moves = g.moves({ verbose: true });
  if(!moves.length){
    if(g.in_checkmate()){
      // тот, чей ход — получил мат
      return g.turn() === 'w' ? -100000 + (10 - d) : 100000 - (10 - d);
    }
    return 0; // пат
  }
  // простая упорядоченность: сначала взятия
  moves.sort((a,b) => (b.captured ? VAL[b.captured] : 0) - (a.captured ? VAL[a.captured] : 0));

  const white = g.turn() === 'w';
  let best = white ? -Infinity : Infinity;

  for(const m of moves){
    g.move(m);
    const s = search(g, d - 1, alpha, beta);
    g.undo();
    if(white){
      if(s > best) best = s;
      if(best > alpha) alpha = best;
    } else {
      if(s < best) best = s;
      if(best < beta) beta = best;
    }
    if(beta <= alpha) break;
  }
  return best;
}

function findBestMove(g, d){
  const moves = g.moves({ verbose: true });
  if(!moves.length) return null;
  moves.sort((a,b) => (b.captured ? VAL[b.captured] : 0) - (a.captured ? VAL[a.captured] : 0));

  const white = g.turn() === 'w';
  let best = null;
  let bestScore = white ? -Infinity : Infinity;

  for(const m of moves){
    g.move(m);
    const s = search(g, d - 1, -Infinity, Infinity);
    g.undo();
    if(white ? s > bestScore : s < bestScore){
      bestScore = s;
      best = m;
    }
  }
  return best;
}

function engineMove(){
  thinking = true;
  updateStatus();
  setTimeout(() => {
    const move = findBestMove(game, depth);
    if(move){
      const mv = game.move({ from: move.from, to: move.to, promotion: move.promotion || 'q' });
      if(mv) lastMove = { from: mv.from, to: mv.to };
    }
    thinking = false;
    render();
    updateStatus();
  }, 40);
}

/* ================= управление ================= */
function newGame(){
  game = new Chess();
  selected = null; legalTargets.clear();
  lastMove = null; thinking = false;
  flipped = playerColor === 'b';
  render();
  updateStatus();
  if(playerColor === 'b') engineMove();
}

document.getElementById('newBtn').addEventListener('click', newGame);
document.getElementById('undoBtn').addEventListener('click', () => {
  if(thinking) return;
  // отменяем два полухода, если ходил движок
  game.undo();
  if(game.turn() !== playerColor && game.history().length) game.undo();
  selected = null; legalTargets.clear();
  const h = game.history({ verbose: true });
  lastMove = h.length ? { from: h[h.length-1].from, to: h[h.length-1].to } : null;
  render(); updateStatus();
});
document.getElementById('flipBtn').addEventListener('click', () => {
  flipped = !flipped; render();
});
document.getElementById('sideSel').addEventListener('change', e => {
  playerColor = e.target.value;
  newGame();
});
document.getElementById('diffSel').addEventListener('change', e => {
  depth = parseInt(e.target.value, 10);
});

/* ================= старт ================= */
render();
updateStatus();
</script>
</body>
</html>
